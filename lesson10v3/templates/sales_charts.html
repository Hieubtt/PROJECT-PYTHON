<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phân tích chi tiết - Sales Charts</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

  <style>
    .chart-container {
      position: relative;
      height: 400px;
      width: 100%;
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-600 to-purple-700 text-white py-8">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <h1 class="text-3xl font-bold">Phân tích chi tiết 3 tháng gần nhất có dữ liệu</h1>
      <p id="dataInfo" class="mt-2 text-indigo-100">Dữ liệu từ file DE.csv</p>
    </div>
  </header>

  <!-- Loading -->
  <div id="loading" class="flex flex-col items-center justify-center py-32">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-indigo-600"></div>
    <p class="mt-6 text-xl text-gray-700">Đang tải dữ liệu chi tiết...</p>
  </div>

  <!-- Content -->
  <div id="content" class="hidden max-w-7xl mx-auto px-4 py-10">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">

      <!-- 1. Pie - Doanh thu theo 3 tháng gần nhất -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-xl font-bold mb-4 text-center flex items-center justify-center">
          <i class="fas fa-chart-pie text-indigo-600 mr-2"></i>
          Doanh thu 3 tháng gần nhất
        </h2>
        <div class="chart-container">
          <canvas id="pieMonthChart"></canvas>
        </div>
      </div>

      <!-- 2. Pie - Doanh thu theo sản phẩm -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-xl font-bold mb-4 text-center flex items-center justify-center">
          <i class="fas fa-chart-pie text-purple-600 mr-2"></i>
          Phân bổ doanh thu theo sản phẩm
        </h2>
        <div class="chart-container">
          <canvas id="pieProductChart"></canvas>
        </div>
      </div>

    </div>

    <!-- 3. Bar kết hợp Doanh thu & Số lượng theo tháng -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-10">
      <h2 class="text-xl font-bold mb-6 text-center flex items-center justify-center">
        <i class="fas fa-layer-group text-emerald-600 mr-2"></i>
        So sánh Doanh thu & Số lượng theo tháng
      </h2>
      <div class="chart-container">
        <canvas id="monthlyCombinedChart"></canvas>
      </div>
    </div>

    <!-- Bar chart theo nhân viên -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-10">
      <h2 class="text-xl font-bold mb-6 text-center flex items-center justify-center">
        <i class="fas fa-users text-rose-600 mr-2"></i>
        Doanh thu & Số lượng theo Nhân viên (3 tháng gần nhất)
      </h2>
      <div class="chart-container">
        <canvas id="staffPerformanceChart"></canvas>
      </div>
    </div>

    <!-- Dartboard - Tuần doanh thu cao nhất -->
    <div class="bg-white rounded-xl shadow-lg p-6">
      <h2 class="text-xl font-bold mb-4 flex items-center justify-center">
        <i class="fas fa-radar-chart text-purple-600 mr-2"></i>
        Dartboard - Tuần đạt doanh thu cao nhất
      </h2>
      <div class="chart-container" style="height: 420px;">
        <canvas id="radarTopWeekChart"></canvas>
      </div>
      <p id="topWeekInfo" class="text-center mt-4 text-gray-600 font-medium"></p>
    </div>

  </div>

  <script>
    // Global chart instances
    const charts = {};

    async function loadData() {
      try {
        const response = await fetch('/api/sales_report');
        if (!response.ok) throw new Error('API error');
        const data = await response.json();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');

        processSalesData(data);
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = `
          <div class="text-red-600 text-center py-32">
            <i class="fas fa-exclamation-circle text-6xl mb-6"></i>
            <p class="text-2xl font-bold">Lỗi tải dữ liệu chi tiết</p>
            <p class="mt-4">Kiểm tra kết nối API hoặc file DE.csv</p>
          </div>
        `;
      }
    }

    function processSalesData(data) {
      if (!Array.isArray(data) || data.length === 0) {
        alert('Không có dữ liệu để phân tích chi tiết');
        return;
      }

      // === Tìm 3 tháng gần nhất THỰC TẾ có trong dữ liệu ===
      const monthSet = new Set();

      data.forEach(row => {
        let dateStr = row.Ngaydathang;
        if (!dateStr) return;

        let year, month;
        if (typeof dateStr === 'string') {
          dateStr = dateStr.trim();
          const parts = dateStr.split(/[-/]/);
          if (parts.length >= 2) {
            if (parts[0].length === 4) {
              // YYYY-MM-DD hoặc YYYY/MM/DD
              year = parts[0];
              month = parts[1].padStart(2, '0');
            } else if (parts.length >= 3 && parts[2]?.length === 4) {
              // DD/MM/YYYY hoặc DD-MM-YYYY
              year = parts[2];
              month = parts[1].padStart(2, '0');
            }
          }
        }

        if (year && month && year.length === 4 && month.length === 2) {
          const key = `${year}-${month}`;
          monthSet.add(key);
        }
      });

      // Sắp xếp giảm dần (tháng mới nhất trước)
      const allMonthsSorted = Array.from(monthSet).sort((a, b) => b.localeCompare(a));

      // Lấy tối đa 3 tháng gần nhất
      const last3Months = allMonthsSorted.slice(0, 3);

      if (last3Months.length === 0) {
        alert('Không tìm thấy tháng nào hợp lệ trong cột Ngaydathang');
        return;
      }

      // Hiển thị thông tin tháng đang dùng
      document.getElementById('dataInfo').textContent = 
        `Dữ liệu từ file DE.csv | Tháng: ${last3Months.join(' → ')}`;

      // Khởi tạo
      const revenueByMonth = {};
      const monthlyQuantity = {};
      const revenueByProduct = {};
      const staffPerformance = {};

      last3Months.forEach(m => {
        revenueByMonth[m] = 0;
        monthlyQuantity[m] = { revenue: 0, qty: 0 };
      });

      // === Xử lý dữ liệu ===
      data.forEach(row => {
        let dateStr = row.Ngaydathang;
        if (!dateStr) return;

        let year, month;
        if (typeof dateStr === 'string') {
          dateStr = dateStr.trim();
          const parts = dateStr.split(/[-/]/);
          if (parts.length >= 2) {
            if (parts[0].length === 4) {
              year = parts[0];
              month = parts[1].padStart(2, '0');
            } else if (parts.length >= 3 && parts[2]?.length === 4) {
              year = parts[2];
              month = parts[1].padStart(2, '0');
            }
          }
        }

        const maNV = (row.MaNV || 'Không xác định').trim();
        const tenNV = (row.Tennhanvien || 'Không xác định').trim();
        const staffKey = `${maNV} - ${tenNV}`;

        if (!staffPerformance[staffKey]) {
          staffPerformance[staffKey] = { revenue: 0, qty: 0 };
        }

        if (year && month) {
          const key = `${year}-${month}`;
          if (last3Months.includes(key)) {
            const doanhthu = Number(row.Doanhthu) || 0;
            const soluong = Number(row.SanLuongLe) || Number(row.Soluong) || 0;

            revenueByMonth[key] += doanhthu;
            monthlyQuantity[key].revenue += doanhthu;
            monthlyQuantity[key].qty += soluong;

            staffPerformance[staffKey].revenue += doanhthu;
            staffPerformance[staffKey].qty += soluong;
          }
        }

        // Doanh thu theo sản phẩm (tổng toàn bộ)
        const masp = row.MasanphamTAC || 'Không xác định';
        revenueByProduct[masp] = (revenueByProduct[masp] || 0) + (Number(row.Doanhthu) || 0);
      });

      // === Vẽ biểu đồ ===

      // 1. Pie tháng
      charts.pieMonth = new Chart(document.getElementById('pieMonthChart'), {
        type: 'pie',
        data: {
          labels: last3Months,
          datasets: [{
            data: last3Months.map(m => revenueByMonth[m] || 0),
            backgroundColor: ['#3B82F6', '#10B981', '#F59E0B']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' },
            datalabels: {
              color: '#fff',
              formatter: (v, ctx) => {
                const t = ctx.dataset.data.reduce((a, b) => a + b, 0);
                return t ? Math.round(v / t * 100) + '%' : '';
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });

      // 2. Pie sản phẩm
      const prodLabels = Object.keys(revenueByProduct);
      const prodData = Object.values(revenueByProduct);

      charts.pieProduct = new Chart(document.getElementById('pieProductChart'), {
        type: 'pie',
        data: {
          labels: prodLabels,
          datasets: [{
            data: prodData,
            backgroundColor: [
              '#3B82F6', '#10B981', '#EF4444', '#F59E0B', '#8B5CF6',
              '#EC4899', '#14B8A6', '#6366F1', '#F97316', '#06B6D4'
            ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right' },
            datalabels: {
              color: '#fff',
              formatter: (v, ctx) => {
                const t = ctx.dataset.data.reduce((a, b) => a + b, 0);
                return t ? Math.round(v / t * 100) + '%' : '';
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });

      // 3. Bar kết hợp tháng
      charts.monthlyCombined = new Chart(document.getElementById('monthlyCombinedChart'), {
        type: 'bar',
        data: {
          labels: last3Months,
          datasets: [
            {
              label: 'Doanh thu (₫)',
              data: last3Months.map(m => monthlyQuantity[m]?.revenue || 0),
              backgroundColor: '#10B981',
              yAxisID: 'y'
            },
            {
              label: 'Số lượng',
              data: last3Months.map(m => monthlyQuantity[m]?.qty || 0),
              backgroundColor: '#3B82F6',
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { position: 'left', title: { display: true, text: 'Doanh thu' } },
            y1: { position: 'right', title: { display: true, text: 'Số lượng' }, grid: { drawOnChartArea: false } }
          }
        }
      });

      // 4. Bar theo nhân viên
      const staffEntries = Object.entries(staffPerformance)
        .filter(([, stats]) => stats.revenue > 0)
        .sort((a, b) => b[1].revenue - a[1].revenue);

      const staffLabels = staffEntries.map(([name]) => name.length > 22 ? name.slice(0, 19) + '...' : name);
      const staffRevenue = staffEntries.map(([, stats]) => stats.revenue);
      const staffQty = staffEntries.map(([, stats]) => stats.qty);

      charts.staffPerformance = new Chart(document.getElementById('staffPerformanceChart'), {
        type: 'bar',
        data: {
          labels: staffLabels,
          datasets: [
            {
              label: 'Doanh thu (₫)',
              data: staffRevenue,
              backgroundColor: '#EC4899',
              yAxisID: 'y'
            },
            {
              label: 'Số lượng',
              data: staffQty,
              backgroundColor: '#6366F1',
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: staffLabels.length > 12 ? 'y' : 'x',
          scales: {
            y: { 
              position: 'left', 
              title: { display: true, text: 'Doanh thu' },
              ticks: { callback: v => v.toLocaleString('vi-VN') }
            },
            y1: { 
              position: 'right', 
              title: { display: true, text: 'Số lượng' }, 
              grid: { drawOnChartArea: false },
              ticks: { callback: v => v.toLocaleString('vi-VN') }
            },
            x: { 
              ticks: { autoSkip: false, maxRotation: 45, minRotation: 45 }
            }
          },
          plugins: {
            legend: { position: 'top' },
            tooltip: {
              callbacks: {
                label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('vi-VN')}`
              }
            }
          }
        }
      });

      // === Radar chart tuần cao nhất (bạn giữ nguyên code cũ) ===
      createRadarChartForTopWeek(data);
    }

    // Hàm radar chart (bạn paste code cũ vào đây)
    function createRadarChartForTopWeek(data) {
      // ... code radar chart cũ của bạn ...
      // Nếu chưa có thì để trống hoặc comment tạm cũng được
    }

    // Khởi động
    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>

</html>
